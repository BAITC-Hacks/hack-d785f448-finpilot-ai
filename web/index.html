<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Граф денег — очередь проверки</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Граф денег</h1>
  <span class="meta" id="meta">загрузка…</span>
  <nav class="tabs" id="tabs">
    <button type="button" data-tab="queue" class="active">Очередь проверки</button>
  </nav>
</header>
<main class="layout">
  <section class="left">
    <div class="tab" id="tab-queue">
      <table class="grid queue" id="queue">
        <thead><tr><th>#</th><th>gid</th><th>Роль</th><th>Приоритет</th><th>Признаки</th><th>Метки</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  <section class="right">
    <form class="mapbar" id="search-form" autocomplete="off">
      <input id="search" type="search" placeholder="Поиск по gid" spellcheck="false">
      <button type="submit">Найти</button>
      <span id="search-msg" class="muted"></span>
      <span class="legend" id="legend"></span>
    </form>
    <div id="map"></div>
    <div id="map-status" class="map-status">карта строится…</div>
  </section>
  <aside class="card" id="card" hidden></aside>
</main>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script>window.vis || document.write('<script src="vendor/vis-network.min.js"><\/script>');</script>
<script src="app.js"></script>
</body>
</html>
